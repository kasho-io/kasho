# pg_hba.conf — SSL-only remote connections for demo environment
#
# TYPE  DATABASE  USER  ADDRESS       METHOD

# Allow local Unix socket connections without SSL (for init scripts, health checks)
local   all       all                 scram-sha-256

# Require SSL for all TCP connections (IPv4 and IPv6)
hostssl all       all   0.0.0.0/0     scram-sha-256
hostssl all       all   ::/0          scram-sha-256
