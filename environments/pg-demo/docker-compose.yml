# Kasho local demo (PostgreSQL)
#
#   docker compose up -d      # then open http://localhost:3001
#   docker compose down -v    # remove everything
#
# Uses the published images, so there is nothing to build. All database and
# Redis state lives in memory: the bootstrap only runs from a clean start, so
# every `up` rebuilds the demo from scratch. The credentials below are for this
# throwaway local stack only, and only the demo UI is published to the host.

name: kasho-demo

x-kasho-env: &kasho-env
  KV_URL: redis://redis:6379
  CHANGE_STREAM_SERVICE_ADDR: pg-change-stream:50051
  PRIMARY_DATABASE_URL: postgresql://kasho:kasho@postgres-primary:5432/primary_db?sslmode=disable
  REPLICA_DATABASE_URL: postgresql://kasho:kasho@postgres-replica:5432/replica_db?sslmode=disable

services:
  prepare-postgres-init-d:
    image: kashoio/kasho:develop
    # The image runs as a non-root user, but freshly created volumes are owned by root.
    user: root
    volumes:
      - ../../sql:/app/sql:ro
      - primary-init:/app/primary-init.d
      - replica-init:/app/replica-init.d
      - ../../scripts/development/populate-postgres-init.sh:/app/scripts/populate-postgres-init.sh:ro
    environment:
      <<: *kasho-env
      ENV: demo
    command: ["/app/scripts/populate-postgres-init.sh"]

  redis:
    image: redis:7-alpine
    command: redis-server --save "" --appendonly no

  postgres-primary:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: primary_db
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - primary-init:/docker-entrypoint-initdb.d:ro
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    healthcheck:
      # Uses TCP because the server only listens on a Unix socket during init.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "primary_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      prepare-postgres-init-d:
        condition: service_completed_successfully

  postgres-replica:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: replica_db
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - replica-init:/docker-entrypoint-initdb.d:ro
    command: postgres -c wal_level=logical -c max_wal_senders=10 -c max_replication_slots=10
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "replica_db"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      prepare-postgres-init-d:
        condition: service_completed_successfully

  pg-change-stream:
    image: kashoio/kasho:develop
    command: ["/app/bin/pg-change-stream"]
    environment: *kasho-env
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "50051"]
      interval: 2s
      timeout: 3s
      retries: 30
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis:
        condition: service_started

  translicator:
    image: kashoio/kasho:develop
    command: ["/app/bin/translicator"]
    environment: *kasho-env
    volumes:
      - ./config:/app/config:ro
    depends_on:
      pg-change-stream:
        condition: service_healthy
      postgres-replica:
        condition: service_healthy

  bootstrap:
    image: kashoio/kasho:develop
    command: ["/app/scripts/bootstrap-kasho-pg.sh"]
    environment:
      <<: *kasho-env
      # Taking the snapshot needs superuser access to the primary.
      PRIMARY_DATABASE_URL: postgresql://postgres:postgres@postgres-primary:5432/primary_db?sslmode=disable
      REPLICATION_SLOT_NAME: kasho_slot
      WAIT_FOR_BOOTSTRAP: "true"
    depends_on:
      translicator:
        condition: service_started
      pg-change-stream:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy

  demo:
    image: kashoio/kasho-demo:develop
    environment:
      PRIMARY_DATABASE_URL: postgresql://kasho:kasho@postgres-primary:5432/primary_db?sslmode=disable
      REPLICA_DATABASE_URL: postgresql://kasho:kasho@postgres-replica:5432/replica_db?sslmode=disable
    volumes:
      # The UI's config panel reads this path, so it always shows the active transforms.
      - ./config:/app/environments/pg-development/config:ro
    ports:
      - "127.0.0.1:${DEMO_PORT:-3001}:3001"
    depends_on:
      bootstrap:
        condition: service_completed_successfully

volumes:
  primary-init:
  replica-init:
